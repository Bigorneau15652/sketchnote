name: Publish a release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check that the tag is the version of the manifest
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "The tag ${GITHUB_REF_NAME} is different from the version of the manifest ${VERSION}."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Attest the provenance of the files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Prepare the release notes
        run: |
          awk -v v="${GITHUB_REF_NAME}" '$0 == "## " v {found=1; next} /^## / {found=0} found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then git log -1 --format=%s > release-notes.md; fi
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" main.js manifest.json styles.css --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi
